# Hämtar nya annonser varje måndag kl. 06:00 (svensk tid ungefär), kör alla tester och publicerar sidan på GitHub Pages.
# Går ett test sönder sparas ingen ny data och sidan publiceras inte; den gamla ligger kvar.
# Kräver: repot ligger på GitHub och Settings → Pages → Source är satt till "GitHub Actions".
name: Veckouppdatering av jobbannonser

on:
  schedule:
    - cron: "0 5 * * 1"     # måndagar 05:00 UTC
  workflow_dispatch:          # gör att du kan köra den manuellt under fliken Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # inget ska kunna hänga i timmar
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta annonser (bara vid schema/manuell körning)
        if: github.event_name != 'push'
        run: python3 skript/hamta_annonser.py
      - name: Bygg index.html
        run: python3 skript/bygg_sida.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installera testverktyg
        id: install
        timeout-minutes: 15
        # Testwebbläsaren behöver paket från Ubuntu. Svarar deras servrar inte försöker vi tre gånger
        # (max 4 minuter per försök). Går det ändå inte körs resten av testerna och sidan publiceras.
        run: |
          npm ci
          for i in 1 2 3; do
            if timeout 240 npx playwright install --with-deps --only-shell chromium; then
              echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Försök $i att installera testwebbläsaren misslyckades, väntar och försöker igen"
            sleep 20
          done
          echo "ok=0" >> "$GITHUB_OUTPUT"
      - name: Testa (funktion, validering, säkerhet, webbläsare)
        timeout-minutes: 8
        run: |
          if [ "${{ steps.install.outputs.ok }}" = "1" ]; then
            ./testa.sh
          else
            echo "::warning title=Webbläsartesterna hoppades över::Testwebbläsaren gick inte att installera (nätverksfel hos GitHub). Python- och JavaScript-testerna, med validering och säkerhet, kördes som vanligt."
            ./testa.sh snabb
          fi
      - name: Spara testresultat om något gick fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: test-results
          retention-days: 7
      - name: Spara ny data i repot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data index.html
          git diff --cached --quiet || git commit -m "Veckouppdatering av annonser $(date +%F)"
          git push
      - name: Förbered publicering
        run: mkdir -p _site/data && cp index.html _site/ && cp data/annonstext.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
